name: Daily Visual Tests

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  daily-visual-tests:
    name: 'Daily Visual Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get yarn cache
        uses: actions/cache@v5
        id: yarn-cache
        with:
          path: |
            **/node_modules
            ~/.cache
          key: ${{ runner.os }}-repo-daily-node-24-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install Node.js dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Install Cypress binary
        run: yarn cypress install

      - run: yarn build

      - name: Run visual tests
        run: yarn test:visual
        env:
          VRT_APIURL: ${{ secrets.VRT_APIURL }}
          VRT_APIKEY: ${{ secrets.VRT_APIKEY }}
          VRT_PROJECT: ${{ secrets.VRT_PROJECT }}
          VRT_BRANCHNAME: main
          VRT_CIBUILDID: ${{ github.sha }}

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-visual-screenshots-${{ github.run_id }}
          path: packages/embed/e2e/screenshots/
          if-no-files-found: ignore

  notify-results:
    name: 'Notify Test Results'
    runs-on: ubuntu-latest
    needs: [daily-visual-tests]
    if: always()
    steps:
      - name: Notify on failure
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        if: needs.daily-visual-tests.result != 'success'
        with:
          status: failure
          notify_when: 'failure'
          notification_title: '🚨 Daily Visual Tests Failed'
          message_format: '*{workflow}* {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked Repo <{repo_url}|{repo}> | <{run_url}|View Run>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}

      - name: Notify on success
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        if: needs.daily-visual-tests.result == 'success'
        with:
          status: success
          notify_when: 'success'
          notification_title: '✅ Daily Visual Tests Passed'
          message_format: '*{workflow}* {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked Repo <{repo_url}|{repo}> | <{run_url}|View Run>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}
